# Local dev stack: the pipeline + a Postgres it could load into.
# Run:  docker compose up
services:
  pipeline:
    build: .
    environment:
      # secrets/config come from the environment, NEVER baked into the image
      WAREHOUSE_URL: postgresql://etl:etl@postgres:5432/analytics
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: etl
      POSTGRES_PASSWORD: etl
      POSTGRES_DB: analytics
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etl -d analytics"]
      interval: 5s
      timeout: 3s
      retries: 5
